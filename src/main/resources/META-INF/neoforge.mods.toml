[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
credits="Contentlos / CMD Core Modul"
authors="Contentlos"
description='''
NightWatch Core – Server-Verwaltungs- und Admin-System für Minecraft 1.21.1 NeoForge.

Enthält intern das CMD-Core-Modul. Bietet:
- Vollwertiges deutschsprachiges Admin-Panel
- Permission-System mit USER/HELPER/MODERATOR/ADMIN/OWNER/CONSOLE
- Spielerverwaltung, Server-Steuerung und Modul-Übersicht
- Audit-Log und Admin-Verlauf
- Konfiguration über mehrere TOML-Configs
- Deutschsprachige Befehle: /nw und /nightwatch
'''

[[dependencies.${mod_id}]]
